<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เจอกู · ทำมีม เป็นไงล่ะไอสัส เจอกู</title>
<meta name="description" content="ทำมีม “เป็นไงล่ะไอสัส เจอกู” จากรูปของคุณ ใส่ได้ 1-3 รูป แล้วโหลดได้เลย">
<!-- รูปพรีวิวตอนแชร์ลิงก์ -->
<meta property="og:title" content="เป็นไงล่ะไอสัส เจอกู">
<meta property="og:description" content="ใส่รูปของคุณ แล้วโหลดมีมไปใช้ได้เลย">
<meta property="og:image" content="https://ssupawat.github.io/jergu/og.png">
<meta property="og:url" content="https://ssupawat.github.io/jergu/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Kanit:wght@900&family=Sarabun:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: มีมเดียว ใส่รูปแล้วจบ
   IDEA: ตรายางปั๊ม "เป็นไงล่ะไอสัส เจอกู" ลงบนรูป 1-3 รูปที่เรียงต่อกัน
   PICTURE: ตัวรูปมีมเอง ใหญ่ อยู่บนสุด
   COLOUR and TYPE: Untitled UI (เทา ขาว ม่วง #7F56D9), Inter + Noto Sans Thai; บนมีมใช้ Kanit/Sarabun
   LAYOUT: รูปซ้าย ปุ่มขวา; จอแคบเรียงบนลงล่าง */
:root{color-scheme:light dark;
  --bg:light-dark(#F9FAFB,#0C111D); --card:light-dark(#FFFFFF,#161B26); --line:light-dark(#EAECF0,#1F242F);
  --line2:light-dark(#D0D5DD,#333741); --ink:light-dark(#101828,#F5F5F6); --ink2:light-dark(#344054,#CECFD2);
  --muted:light-dark(#475467,#94969C); --faint:light-dark(#667085,#85888E); --soft:light-dark(#F9FAFB,#1F242F);
  --p600:#7F56D9; --p700:#6941C6; --pbg:light-dark(#F9F5FF,#2C1C5F); --pline:light-dark(#E9D7FE,#53389E);
  --pink:light-dark(#6941C6,#D6BBFB); --ring:light-dark(#F4EBFF,#2C1C5F); --shadow:0 1px 2px rgba(16,24,40,.05)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Noto Sans Thai",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
header,main{max-width:1040px;margin:auto;padding-inline:16px}
header{padding-top:24px}
h1{font-size:30px;line-height:1.15;font-weight:600;margin:0}
header p{margin:6px 0 0;color:var(--muted);font-size:16px}
main{display:grid;gap:24px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start;padding-block:20px 40px}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr);gap:16px}h1{font-size:26px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px}
.stage{padding:12px}
#out{display:block;width:100%;height:auto;border-radius:8px;-webkit-touch-callout:default}
.drop{display:grid;place-items:center;aspect-ratio:1;border:2px dashed var(--line2);border-radius:8px;background:var(--soft);cursor:pointer;text-align:center;padding:24px;color:var(--muted)}
.drop strong{display:block;color:var(--ink2);font-size:18px;font-weight:600;margin-bottom:4px}
.stage.on .drop{border-color:var(--p600);background:var(--pbg)}
.drop svg{width:40px;height:40px;color:var(--faint);margin-bottom:10px}
.quote{font-family:Kanit,"Noto Sans Thai",sans-serif;font-weight:900;font-size:26px;line-height:1.3;margin:0 0 4px}
.field+.field{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.h{display:block;font-weight:500;color:var(--ink2);margin:0 0 8px}
.hint{color:var(--faint);font-size:13px;margin-top:8px;min-height:20px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.seg button{flex:1;min-height:44px;border:0;border-left:1px solid var(--line2);background:var(--card);color:var(--ink2);font:inherit;font-weight:600;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:44px;border-radius:8px;padding:10px 16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.btn svg{width:20px;height:20px;flex:none}
.sec{border:1px solid var(--line2);background:var(--card);color:var(--ink2)}
.sec:hover{background:var(--soft)}
.pri{border:1px solid var(--p600);background:var(--p600);color:#fff;margin-top:24px}
.pri:hover{background:var(--p700)}
.btn:disabled,.ib:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.drop:focus-visible,.ib:focus-visible,.tag:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* รายการรูป */
.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.list li{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:10px}
.list img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:var(--soft)}
.list .grow{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.list .n{font-weight:600;color:var(--ink2)}
.tag{min-height:32px;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:16px;padding:4px 10px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.tag[aria-pressed=true]{background:var(--pbg);border-color:var(--pline);color:var(--pink)}
.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:8px;cursor:pointer}
.ib:hover:not(:disabled){background:var(--soft)}
.ib svg{width:18px;height:18px}
#msg{text-align:center}
</style>
</head>
<body>
<header>
  <h1>เจอกู</h1>
  <p>ใส่รูป 1-3 รูป แล้วโหลดไปใช้ได้เลย</p>
</header>

<main>
  <div class="card stage" id="stage">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="เลือกรูป">
      <div>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 15v1.2c0 1.68 0 2.52-.33 3.16a3 3 0 0 1-1.31 1.31C18.72 21 17.88 21 16.2 21H7.8c-1.68 0-2.52 0-3.16-.33a3 3 0 0 1-1.31-1.31C3 18.72 3 17.88 3 16.2V15m14-7-5-5m0 0L7 8m5-5v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <strong>แตะเพื่อเลือกรูป</strong>
        เลือกได้ 1-3 รูป หรือลากมาวาง / กด Ctrl+V
      </div>
    </div>
    <img id="out" alt="มีม เป็นไงล่ะไอสัส เจอกู" hidden>
    <canvas id="cv" hidden></canvas>
  </div>

  <div class="card">
    <p class="quote">“เป็นไงล่ะไอสัส เจอกู”</p>
    <div class="hint" style="margin-top:0">ใช้ตอนชนะหรือพลิกเกมได้ แล้วอยากโชว์เหนือ</div>

    <div class="field">
      <label class="btn sec" for="file" id="addBtn">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M17.5 12.5v1c0 1.4 0 2.1-.27 2.64a2.5 2.5 0 0 1-1.1 1.1c-.53.26-1.23.26-2.63.26h-7c-1.4 0-2.1 0-2.64-.27a2.5 2.5 0 0 1-1.09-1.1c-.27-.53-.27-1.23-.27-2.63v-1M14.17 6.67 10 2.5m0 0L5.83 6.67M10 2.5v10" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="upLabel">เลือกรูป</span>
      </label>
      <input type="file" id="file" accept="image/*" multiple>
      <ul class="list" id="list" aria-label="รูปที่ใส่"></ul>
      <div class="hint" id="upHint">รูปอยู่ในเครื่องคุณ ไม่ถูกส่งไปไหน</div>
    </div>

    <div class="field">
      <span class="h" id="styleLabel">แบบตัวหนังสือ</span>
      <div class="seg" role="group" aria-labelledby="styleLabel">
        <button data-style="quote" aria-pressed="true">อ้างคำพูด</button>
        <button data-style="subtitle" aria-pressed="false">ซับหนัง</button>
      </div>
      <div class="hint">เลือกให้อัตโนมัติ: รูปเดียวแนวนอนเป็นซับหนัง นอกนั้นเป็นอ้างคำพูด</div>
    </div>

    <button class="btn pri" id="dl" disabled>
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M17.5 12.5v1c0 1.4 0 2.1-.27 2.64a2.5 2.5 0 0 1-1.1 1.1c-.53.26-1.23.26-2.63.26h-7c-1.4 0-2.1 0-2.64-.27a2.5 2.5 0 0 1-1.09-1.1c-.27-.53-.27-1.23-.27-2.63v-1M5.83 8.33 10 12.5m0 0 4.17-4.17M10 12.5v-10" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/></svg>
      โหลดรูป
    </button>
    <button class="btn sec" id="share" disabled hidden style="margin-top:12px">แชร์</button>
    <div class="hint" id="msg" aria-live="polite"></div>
  </div>
</main>

<script>
{
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), out = $("out");
const MAX = 3, GAP = 10, WIDTH = 1200;
const QUOTE = "เป็นไงล่ะ\nไอสัส เจอกู";   // ตัดบรรทัดแบบต้นฉบับ (ถ้าพื้นที่กว้างพอจะรวมเป็นบรรทัดเดียว)
const SUB = "เป็นไงล่ะไอ้สัส เจอกู";
const state = { imgs: [], at: 0, style: "quote", styleTouched: false };   // at = รูปที่มีวลี
const inArtifact = !!window.claude;
let downloads = null;

// ---------- วาดตัวหนังสือ ----------
function fitSize(rows, font, maxW, maxH, maxSize, lineH) {
  for (let size = maxSize; size >= 14; size -= 2) {
    ctx.font = font.replace("{s}", size);
    if (rows.every(r => ctx.measureText(r).width <= maxW) && rows.length * size * lineH <= maxH) return size;
  }
  return 14;
}
function draw(rows, { box, font, maxSize, stroke, shadow = 0, lineH = 1.3 }) {
  const [x0, y0, x1, y1] = box, w = x1 - x0;
  const size = fitSize(rows, font, w, y1 - y0, maxSize, lineH);
  ctx.font = font.replace("{s}", size);
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = shadow;
  let y = y1 - rows.length * size * lineH;
  for (const r of rows) {
    const cy = y + size * lineH / 2;
    if (stroke) { ctx.lineWidth = Math.max(3, size * .16); ctx.strokeStyle = "#000"; ctx.strokeText(r, x0 + w / 2, cy); }
    ctx.fillStyle = "#fff"; ctx.fillText(r, x0 + w / 2, cy);
    y += size * lineH;
  }
  ctx.shadowBlur = 0;
}
function caption(x0, y0, W, H) {
  const pad = W * .05;
  if (state.style === "subtitle") {
    draw([SUB], { box: [x0 + pad, y0 + H * .72, x0 + W - pad, y0 + H * .95], font: "500 {s}px Sarabun, 'Noto Sans Thai', sans-serif",
      maxSize: Math.round(Math.min(W, H * 1.6) / 22), stroke: false, shadow: 8 });
    return;
  }
  // แผงกว้าง (แบบรูปต่อกัน) ใช้บรรทัดเดียวขนาดพอดี; แผงสี่เหลี่ยมใช้สองบรรทัดตัวใหญ่
  const font = "900 {s}px Kanit, 'Noto Sans Thai', sans-serif";
  const wide = W / H > 1.3;
  const rows = wide ? [`“${QUOTE.replace("\n", "")}”`] : [`“${QUOTE.split("\n")[0]}`, `${QUOTE.split("\n")[1]}”`];
  draw(rows, { box: [x0 + pad, y0 + H * (wide ? .7 : .55), x0 + W - pad, y0 + H * .93], font,
    maxSize: Math.round(wide ? W / 15 : W / 8.5), stroke: true });
}

// ---------- รวมรูป ----------
function render() {
  const n = state.imgs.length, has = n > 0;
  $("drop").hidden = has; out.hidden = !has;
  $("dl").disabled = $("share").disabled = !has;
  $("upLabel").textContent = n >= MAX ? `ครบ ${MAX} รูปแล้ว` : has ? "เพิ่มรูป" : "เลือกรูป";
  $("addBtn").style.opacity = n >= MAX ? .5 : "";
  $("file").disabled = n >= MAX;
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", b.dataset.style === state.style);
  renderList();
  if (!has) return;

  const W = n === 1 ? Math.min(1600, state.imgs[0].width) : WIDTH;
  const hs = state.imgs.map(im => Math.round(W * im.height / im.width));
  cv.width = W; cv.height = hs.reduce((a, b) => a + b, 0) + GAP * (n - 1);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  let y = 0;
  state.imgs.forEach((im, i) => {
    ctx.drawImage(im, 0, y, W, hs[i]);
    if (i === state.at) caption(0, y, W, hs[i]);
    y += hs[i] + GAP;
  });
  out.src = cv.toDataURL("image/jpeg", .92); // เป็น <img> ให้กดค้างบันทึกบนมือถือได้
}

const ICON = {
  up: '<path d="M10 15.8V4.2m0 0L4.2 10M10 4.2l5.8 5.8" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/>',
  down: '<path d="M10 4.2v11.6m0 0 5.8-5.8M10 15.8 4.2 10" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/>',
  del: '<path d="M15 5 5 15M5 5l10 10" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/>',
};
const ib = (act, i, label, off) =>
  `<button class="ib" data-act="${act}" data-i="${i}" aria-label="${label}"${off ? " disabled" : ""}><svg viewBox="0 0 20 20" fill="none">${ICON[act]}</svg></button>`;

function renderList() {
  const n = state.imgs.length;
  $("list").innerHTML = state.imgs.map((im, i) => `<li>
      <img src="${im.src}" alt="">
      <div class="grow"><span class="n">รูป ${i + 1}</span>
        ${n > 1 ? `<button class="tag" data-act="at" data-i="${i}" aria-pressed="${i === state.at}">${i === state.at ? "วลีอยู่รูปนี้" : "ย้ายวลีมานี่"}</button>` : ""}
      </div>
      ${n > 1 ? ib("up", i, `เลื่อนรูป ${i + 1} ขึ้น`, i === 0) + ib("down", i, `เลื่อนรูป ${i + 1} ลง`, i === n - 1) : ""}
      ${ib("del", i, `ลบรูป ${i + 1}`)}
    </li>`).join("");
}
$("list").onclick = e => {
  const b = e.target.closest("button[data-act]"); if (!b || b.disabled) return;
  const i = +b.dataset.i, a = state.imgs, cur = a[state.at];
  if (b.dataset.act === "at") state.at = i;
  if (b.dataset.act === "up") [a[i - 1], a[i]] = [a[i], a[i - 1]];
  if (b.dataset.act === "down") [a[i + 1], a[i]] = [a[i], a[i + 1]];
  if (b.dataset.act === "del") a.splice(i, 1);
  if (b.dataset.act !== "at") state.at = Math.max(0, a.indexOf(cur));   // วลีตามรูปเดิมไป
  autoStyle(); render();
};

function autoStyle() {
  if (state.styleTouched) return;
  const one = state.imgs.length === 1 && state.imgs[0].width / state.imgs[0].height > 1.3;
  state.style = one ? "subtitle" : "quote";
}

function addFiles(files) {
  const imgs = [...files].filter(f => f?.type?.startsWith("image/"));
  const room = MAX - state.imgs.length;
  $("msg").textContent = imgs.length > room ? `ใส่ได้สูงสุด ${MAX} รูป` : "";
  Promise.all(imgs.slice(0, Math.max(0, room)).map(f => new Promise(res => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = URL.createObjectURL(f);
  }))).then(loaded => {
    state.imgs.push(...loaded.filter(Boolean));
    autoStyle(); render();
  });
}

for (const b of document.querySelectorAll(".seg button"))
  b.onclick = () => { state.style = b.dataset.style; state.styleTouched = true; render(); };
$("file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("drop").onclick = () => $("file").click();
$("drop").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
document.addEventListener("paste", e => {
  addFiles([...(e.clipboardData?.items || [])].filter(i => i.type.startsWith("image/")).map(i => i.getAsFile()));
});
document.addEventListener("dragover", e => { e.preventDefault(); $("stage").classList.add("on"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) $("stage").classList.remove("on"); });
document.addEventListener("drop", e => { e.preventDefault(); $("stage").classList.remove("on"); addFiles(e.dataTransfer.files); });

// ---------- โหลด / แชร์ ----------
const NOSAVE = "บนมือถือกดค้างที่รูปแล้วเลือก \"บันทึกรูป\" ได้";
const blob = () => new Promise(r => cv.toBlob(r, "image/png"));
$("dl").onclick = async () => {
  if (!state.imgs.length) return;
  if (inArtifact) {                       // ใน Claude artifact ต้องโหลดผ่าน capability
    if (!downloads) { $("msg").textContent = NOSAVE; return; }
    try { await downloads.save({ filename: "เจอกู.png", data: await blob() }); $("msg").textContent = "บันทึกแล้ว"; }
    catch (err) { const c = err?.code; $("msg").textContent = c === "declined" ? "" : c === "rate_limited" ? "รอสักครู่แล้วกดอีกครั้ง" : NOSAVE; }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(await blob()); a.download = "เจอกู.png";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
// แชร์เข้า LINE/IG/Facebook ตรง ๆ บนมือถือ (เฉพาะเว็บจริง เบราว์เซอร์ที่รองรับ)
const canShareFiles = !inArtifact && !!navigator.canShare?.({ files: [new File([""], "x.png", { type: "image/png" })] });
$("share").hidden = !canShareFiles;
$("share").onclick = async () => {
  if (!state.imgs.length) return;
  try { await navigator.share({ files: [new File([await blob()], "เจอกู.png", { type: "image/png" })] }); }
  catch (e) { if (e.name !== "AbortError") $("msg").textContent = "แชร์ไม่ได้ ลองกดโหลดรูปแทน"; }
};

render();
document.fonts.load("900 40px Kanit", "ก").then(() => document.fonts.load("500 40px Sarabun", "ก")).then(render, () => {});
if (inArtifact) window.claude.use?.("downloads").then(d => { downloads = d; }, () => {});
}
</script>
</body>
</html>
